# Save this file in your fork as:  .github/workflows/build-apk.yml
name: Build WearBridge APK

on:
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 35)
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: wearos-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Inspect APK (package, SDK levels, permissions, watch feature)
        run: |
          APK=wearos-app/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          "$AAPT" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|uses-feature|uses-permission|launchable-activity"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-debug-apk
          path: wearos-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
