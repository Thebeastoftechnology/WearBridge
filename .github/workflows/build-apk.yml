name: Build WearBridge APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install SDK packages (compileSdk 35, build-tools)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build debug APK
        working-directory: wearos-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Inspect APK
        run: |
          APK=wearos-app/app/build/outputs/apk/debug/app-debug.apk
          ls -lh "$APK"
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          echo "=== APK Package Info ==="
          "$AAPT" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|uses-feature.*watch|uses-permission"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WearBridge-debug-apk
          path: wearos-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
